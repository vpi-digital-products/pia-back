# Environment-driven database configuration.
#
# Every setting can be overridden via environment variables so the same file
# works for local development, CI, and containers (see docker-compose.yml).
# Rails also honors DATABASE_URL, which takes precedence over these values.
default: &default
  adapter:  postgresql
  encoding: unicode
  template: template0
  pool:     <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host:     <%= ENV.fetch("DB_HOST", "localhost") %>
  port:     <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "pia_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "pia_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "pia_production") %>
